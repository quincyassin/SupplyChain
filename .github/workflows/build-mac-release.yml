# 在 GitHub 云端自动构建 macOS 单机 zip，本地无需 Node / JDK / Maven
name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "目标架构"
        required: true
        default: both
        type: choice
        options:
          - both
          - aarch64
          - x64
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 生成构建矩阵
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            arch_input="both"
          else
            arch_input="${{ github.event.inputs.arch }}"
          fi
          case "$arch_input" in
            both)
              matrix='{"include":[{"arch":"aarch64"},{"arch":"x64"}]}'
              ;;
            aarch64)
              matrix='{"include":[{"arch":"aarch64"}]}'
              ;;
            x64)
              matrix='{"include":[{"arch":"x64"}]}'
              ;;
            *)
              echo "[错误] 未知架构: $arch_input"
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "将构建: $arch_input"

  build:
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 构建 macOS 发布包（${{ matrix.arch }}）
        run: |
          chmod +x scripts/build-mac-release.sh
          bash scripts/build-mac-release.sh --arch "${{ matrix.arch }}"

      - name: 上传 zip（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: OrderSplitMerge-mac-${{ matrix.arch }}
          path: release/dist/*.zip
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: OrderSplitMerge-mac-*
          merge-multiple: true
          path: release-packages

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-packages/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
