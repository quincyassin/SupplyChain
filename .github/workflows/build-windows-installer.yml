# 在 GitHub 云端自动构建 Windows 安装包，本地无需 Node / JDK / Maven / Inno Setup
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 安装 Inno Setup 6（强制重装）
        shell: pwsh
        run: |
          choco install innosetup -y --force --no-progress
          $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machine;$user"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe 未找到: $iscc"
          }
          Write-Host "Inno Setup 已安装: $iscc"
          Write-Host "Languages 目录: $langDir"
          Get-ChildItem $langDir -Filter "*.isl" | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: 构建安装包
        shell: pwsh
        run: |
          $env:GITHUB_ACTIONS = "true"
          Write-Host "当前 commit: $(git rev-parse HEAD)"
          git log -1 --oneline
          $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machine;$user"
          & "${{ github.workspace }}\scripts\build-windows-release.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传安装包（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: OrderSplitMerge-Setup
          path: release/installer/*.exe
          retention-days: 90
          if-no-files-found: error

      - name: 发布到 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
