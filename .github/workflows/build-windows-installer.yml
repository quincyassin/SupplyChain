# 在 GitHub 云端自动构建 Windows 安装包，本地无需 Node / JDK / Maven / Inno Setup
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 安装 Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: 构建安装包
        shell: pwsh
        run: |
          $env:GITHUB_ACTIONS = "true"
          & "${{ github.workspace }}\scripts\build-windows-release.ps1"

      - name: 上传安装包（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: OrderSplitMerge-Setup
          path: release/installer/*.exe
          retention-days: 90

      - name: 发布到 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/installer/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
