# Windows 单机安装版：内置 H2 文件库 + 前端静态资源，无需 MySQL / Docker
spring:
  datasource:
    url: jdbc:h2:file:./data/db/order_split;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
